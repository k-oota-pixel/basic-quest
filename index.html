<!DOCTYPE html>
<html lang="ja">
<head>
<script src="https://k-oota-pixel.github.io/english-playroom/shell-bridge.js?v=2.1.1"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Quest｜英語語順トレーニング</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2a3a;--sub:#68778b;--accent:#356ae6;--good:#18864b;--bad:#c83b3b;--line:#dbe3ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff 45%,#eefaf5);color:var(--ink);min-height:100vh}
.wrap{max-width:1000px;margin:auto;padding:28px 18px 48px}
header{text-align:center;margin-bottom:22px}
h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:.04em}
.subtitle{color:var(--sub);margin-top:8px}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(45,72,120,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.stage{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 5px;cursor:pointer;font-size:15px;font-weight:800;transition:.15s;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.stage:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 5px 15px rgba(53,106,230,.12)}
.stage.done{background:#e8f7ee;border-color:#8bd0a7;color:var(--good)}
.stage small{display:block;font-size:10.5px;font-weight:650;color:var(--sub);white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25;margin-top:5px;overflow-wrap:anywhere;text-align:center}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.word{font-size:clamp(30px,6vw,54px);font-weight:900;color:var(--accent)}
.progress{font-weight:800;color:var(--sub)}
.japanese{font-size:clamp(20px,3.5vw,30px);font-weight:800;text-align:center;margin:22px 0}
.hint{text-align:center;color:var(--sub);margin-bottom:14px}
.bank,.answer{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;padding:14px;border-radius:16px}
.bank{background:#f4f7fb;border:1px solid var(--line)}
.answer{background:#fff;border:2px dashed #b8c6da;margin:14px 0 18px}
.token{border:1px solid #cbd6e5;background:white;border-radius:9px;padding:7px 10px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.token:hover{border-color:var(--accent)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.action{border:0;border-radius:9px;padding:8px 13px;font-weight:800;font-size:14px;cursor:pointer;min-height:38px}
.check{background:var(--accent);color:white}.reset{background:#edf1f7;color:var(--ink)}.back{background:#fff;border:1px solid var(--line)!important}
.feedback{text-align:center;min-height:32px;font-size:20px;font-weight:900;margin-top:14px}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.complete{text-align:center;padding:30px 10px}.complete .big{font-size:64px}.complete h2{font-size:36px;margin:8px}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:18px}
.hidden{display:none!important}
.mode-switch{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mode-button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer}
.mode-button.active{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:600px){.card{padding:17px}.grid{grid-template-columns:repeat(5,1fr);gap:7px}.stage{font-size:15px;padding:10px 3px}.stage small{display:none}.token{font-size:16px;padding:9px 11px}}

.authbar{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px}
.authbtn,.logoutbtn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;cursor:pointer}
.authbtn:disabled{opacity:.65;cursor:default}.logoutbtn{color:var(--sub)}
.authdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b8c4d2;margin-right:5px}
.authdot.ok{background:var(--good)}.authdot.busy{background:#d6a53b}.authdot.error{background:var(--bad)}
.authnote{font-size:9.5px;color:var(--sub)}
@media(max-width:600px){.authnote{display:none}}


/* Correct-answer celebration: quick confetti from both bottom corners. */
.celebration-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
.confetti-piece{position:absolute;bottom:-18px;width:8px;height:14px;border-radius:2px;background:var(--c);opacity:0;transform:translate(0,0) rotate(0deg);animation:confetti-pop var(--dur,1.9s) cubic-bezier(.18,.75,.28,1) forwards}
.confetti-piece.left,.celebration-spark.left{left:18px}.confetti-piece.right,.celebration-spark.right{right:18px}
.celebration-layer.grand .confetti-piece{filter:drop-shadow(0 2px 2px #8a651d44)}
.celebration-spark{position:absolute;bottom:8px;color:#ffd75f;font-size:20px;font-weight:900;opacity:0;text-shadow:0 1px 5px #fff7c7;animation:celebration-spark var(--dur,2.8s) ease-out forwards}
@keyframes confetti-pop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.8)}7%{opacity:1}72%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
@keyframes celebration-spark{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0deg)}10%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(var(--rot))}}
@media(prefers-reduced-motion:reduce){.celebration-layer{display:none}}

body.basic-grammar-mode #stageGrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}body.basic-grammar-mode .stage small{display:block}body.basic-grammar-mode .bank{justify-content:flex-start;gap:7px}body.basic-grammar-mode .bank .token{font-size:15px;padding:8px 10px}body.basic-grammar-mode .hint{line-height:1.65}body.basic-grammar-mode .word{font-size:clamp(24px,5vw,40px)}
</style>
<style id="monstudy-home-style">
.monstudy-home-wrap{width:min(calc(100% - 28px),1000px);margin:10px auto 0;position:relative;z-index:20}.monstudy-home-link{display:inline-flex;align-items:center;text-decoration:none;color:#385a4e;background:#fff;border:1px solid #d6e1d8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 2px 8px #203b3608}.monstudy-home-link:hover{background:#f2f6f3}.monstudy-home-link:focus-visible{outline:3px solid #e4af37;outline-offset:3px}
</style>
</head>
<body>
<div class="monstudy-home-wrap"><a class="monstudy-home-link" href="https://k-oota-pixel.github.io/english-playroom/" aria-label="もんすたでぃトップへ戻る">←もんすたでぃ</a></div>

<div class="wrap">
<header>
<h1>Basic Quest</h1>
<div class="subtitle">WORD ORDER TRAINING · BASIC 60 STAGES + GRAMMAR 72 SECTIONS + 基本文法 12単元 · ver1.7.2<br>教材を選んで、英文を完成させよう！</div>
<div class="authbar"><button id="basicLogin" class="authbtn" type="button" disabled><span id="basicAuthDot" class="authdot busy"></span><span id="basicAuthLabel">認証準備中…</span></button><span id="basicAuthNote" class="authnote">Firebase接続中</span><button id="basicLogout" class="logoutbtn" type="button" hidden>ログアウト</button></div>
</header>

<section id="selectScreen" class="card">
  <div class="mode-switch" role="group" aria-label="教材を選択">
    <button class="mode-button active" id="basicModeBtn" type="button" onclick="setMode('basic')">並べ替え（基礎）</button>
    <button class="mode-button" id="grammarModeBtn" type="button" onclick="setMode('grammar')">並べ替え問題（文法別）</button>
    <button class="mode-button" id="basicGrammarModeBtn" type="button" onclick="setMode('basic-grammar')">並べ替え問題（基本文法）</button>
  </div>
  <h2 id="stageHeading">ステージを選択</h2>
  <div id="stageGrid" class="grid"></div>
  <div class="note" id="progressSaveNote">✓ はクリア済みです。ログイン時はクラウドにも同期されます。</div>
</section>

<section id="quizScreen" class="card hidden">
  <div class="toprow">
    <button class="action back" onclick="goHome()">← 一覧へ</button>
    <div id="progress" class="progress"></div>
  </div>
  <div class="controls" id="grammarSaveControls"><button class="action reset" id="saveExitBtn" type="button" onclick="saveAndExitGrammar()">途中で終了して保存</button></div>
  <div id="word" class="word"></div>
  <div id="japanese" class="japanese"></div>
  <div class="hint">下の単語をクリックして、正しい英文を作ろう。</div>
  <div id="answer" class="answer"></div>
  <div id="bank" class="bank"></div>
  <div class="controls">
    <button class="action reset" id="resetBtn" onclick="resetQuestion()">やり直す</button>
    <button class="action reset" id="giveupBtn" onclick="giveUp()">わからない</button>
    <button class="action check" id="checkBtn" onclick="checkAnswer()">答え合わせ</button>
  </div>
  <div id="feedback" class="feedback"></div>
  <div class="controls">
    <button class="action check hidden" id="nextBtn" type="button" onclick="continueAfterAnswer()">次の問題へ進む</button>
  </div>
</section>

<section id="completeScreen" class="card complete hidden">
  <div class="big">🎉</div>
  <h2>CLEAR!</h2>
  <p id="completeText"></p>
  <button class="action check" onclick="goHome()">ステージ選択へ</button>
</section>
</div>

<script>
const stages = [{"number": 1, "word": "take", "questions": [{"en": "I took an umbrella with me.", "ja": "傘を持って行きました。"}, {"en": "He took a seat near the window.", "ja": "彼は窓の近くに座りました。"}, {"en": "I took a photo of the sunset.", "ja": "夕日の写真を撮りました。"}, {"en": "She took the book from the shelf.", "ja": "彼女は棚から本を取りました。"}]}, {"number": 2, "word": "give", "questions": [{"en": "She gave me a birthday present.", "ja": "彼女は私に誕生日プレゼントをくれました。"}, {"en": "Can you give me a hand?", "ja": "手伝ってくれますか？"}, {"en": "He gave a speech at the meeting.", "ja": "彼は会議でスピーチをしました。"}, {"en": "The teacher gave us homework.", "ja": "先生は私たちに宿題を出しました。"}]}, {"number": 3, "word": "get", "questions": [{"en": "I got a ticket for the concert.", "ja": "コンサートのチケットを手に入れました。"}, {"en": "She got very tired after work.", "ja": "彼女は仕事の後、とても疲れました。"}, {"en": "He got a job at a bank.", "ja": "彼は銀行に就職しました。"}, {"en": "I got the message from him.", "ja": "彼からメッセージを受け取りました。"}]}, {"number": 4, "word": "make", "questions": [{"en": "She made a cake for the party.", "ja": "彼女はパーティーのためにケーキを作りました。"}, {"en": "I made a mistake on the test.", "ja": "テストで間違えました。"}, {"en": "They made him captain of the team.", "ja": "彼らは彼をチームのキャプテンにしました。"}, {"en": "This news made me happy.", "ja": "このニュースは私を幸せにしました。"}]}, {"number": 5, "word": "break", "questions": [{"en": "He broke the window by accident.", "ja": "彼は誤って窓を壊しました。"}, {"en": "I broke my phone yesterday.", "ja": "昨日スマホを壊しました。"}, {"en": "The machine broke during the night.", "ja": "夜の間に機械が壊れました。"}, {"en": "She broke her leg while skiing.", "ja": "スキー中に彼女は足を骨折しました。"}]}, {"number": 6, "word": "cut", "questions": [{"en": "He cut the paper into small pieces.", "ja": "彼は紙を小さく切りました。"}, {"en": "I cut my finger with a knife.", "ja": "ナイフで指を切りました。"}, {"en": "She cut her hair short.", "ja": "彼女は髪を短く切りました。"}, {"en": "Please cut the cake into eight pieces.", "ja": "ケーキを8つに切ってください。"}]}, {"number": 7, "word": "go", "questions": [{"en": "I go to school by bus.", "ja": "私はバスで学校へ行きます。"}, {"en": "He went home early yesterday.", "ja": "彼は昨日早く帰宅しました。"}, {"en": "Let's go shopping this afternoon.", "ja": "今日の午後、買い物に行きましょう。"}, {"en": "She goes to the gym every morning.", "ja": "彼女は毎朝ジムに通っています。"}]}, {"number": 8, "word": "come", "questions": [{"en": "Please come to my party!", "ja": "私のパーティーに来てください！"}, {"en": "He came home late last night.", "ja": "彼は昨晩遅く帰宅しました。"}, {"en": "A new idea came to me.", "ja": "新しいアイデアが浮かびました。"}, {"en": "She comes from Canada.", "ja": "彼女はカナダ出身です。"}]}, {"number": 9, "word": "leave", "questions": [{"en": "I left my keys on the table.", "ja": "テーブルの上に鍵を置き忘れました。"}, {"en": "He left the room without saying anything.", "ja": "彼は何も言わずに部屋を出ました。"}, {"en": "She left her umbrella at school.", "ja": "彼女は学校に傘を置き忘れました。"}, {"en": "I left early to catch the train.", "ja": "電車に間に合うよう早めに出発しました。"}]}, {"number": 10, "word": "run", "questions": [{"en": "He runs every morning.", "ja": "彼は毎朝走ります。"}, {"en": "The dog ran into the yard.", "ja": "犬が庭に走り込みました。"}, {"en": "I ran a marathon last year.", "ja": "去年マラソンを走りました。"}, {"en": "She ran to catch the bus.", "ja": "彼女はバスに間に合うよう走りました。"}]}, {"number": 11, "word": "catch", "questions": [{"en": "I caught a cold last week.", "ja": "先週風邪をひきました。"}, {"en": "He caught the ball easily.", "ja": "彼は簡単にボールをキャッチしました。"}, {"en": "She caught a taxi to the station.", "ja": "彼女は駅までタクシーに乗りました。"}, {"en": "I caught the train just in time.", "ja": "私はぎりぎりで電車に間に合いました。"}]}, {"number": 12, "word": "do", "questions": [{"en": "I do my homework after dinner.", "ja": "夕食後に宿題をします。"}, {"en": "She does yoga every morning.", "ja": "彼女は毎朝ヨガをします。"}, {"en": "He did his best in the game.", "ja": "彼は試合でベストを尽くしました。"}, {"en": "We did a lot of work today.", "ja": "今日はたくさんの仕事をしました。"}]}, {"number": 13, "word": "be動詞「=」", "questions": [{"en": "It's 10 am.", "ja": "午前10時です。"}, {"en": "We are high school students.", "ja": "私たちは高校生です。"}, {"en": "My birthday is August 10th.", "ja": "私の誕生日は8月10日です。"}, {"en": "I'm sixteen years old.", "ja": "私は16歳です。"}]}, {"number": 14, function renderStages(){
  refreshBasicGrammarNote();
  const grid=document.getElementById("stageGrid"); grid.innerHTML="";
  currentStages().forEach(s=>{
    const done=currentCompleted().has(s.number);
    const saved=isSectionMode()?sectionProgress()[s.number]:null;
    const b=document.createElement("button");
    b.className="stage"+(done?" done":"");
    b.innerHTML=(done?"✓ ":"")+s.number+"<small>"+escapeHtml(s.word)+(saved&&!saved.completed?" · 続き "+saved.solved.length+"/"+(s.questions?.length||0):"")+"</small>";
    b.onclick=()=>startStage(s.number);
    grid.appendChild(b);
  });
}
function escapeHtml(str){const d=document.createElement("div");d.textContent=str;return d.innerHTML;}
function show(id){
  ["selectScreen","quizScreen","completeScreen"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
}
function startStage(n){
  titleOwner=null;
  currentStage=currentStages().find(s=>s.number===n);
  if(!currentStage||!Array.isArray(currentStage.questions)||!currentStage.questions.length)return;
  initialRound=true; retryRound=0; initialCorrect=0; retryQueue=[];
  grammarSolved=isSectionMode()&&!(currentMode==="basic-grammar"&&sectionProgress()[n]?.completed)?new Set((sectionProgress()[n]?.solved||[]).filter(i=>i<currentStage.questions.length)):new Set();
  currentQueue=currentStage.questions.map((q,i)=>({q:currentMode==="basic-grammar"?{...q,en:q.variants[Math.floor(Math.random()*q.variants.length)]}:q,index:i})).filter(item=>!isSectionMode()||!grammarSolved.has(item.index));
  if(!currentQueue.length){finishStage();return;}
  qIndex=0; show("quizScreen"); loadQuestion();
}
function playableSentence(q){return q.en.replace(/\.\s*$/,"");}
function currentItem(){return currentQueue[qIndex];}
function setControls(disabled){
  ["resetBtn","giveupBtn","checkBtn"].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=disabled;});
}
function showNextButton(){
  const next=document.getElementById("nextBtn");
  if(!next)return;
  next.classList.remove("hidden");
  next.disabled=false;
}
function continueAfterAnswer(){
  const next=document.getElementById("nextBtn");
  if(!next||next.disabled)return;
  next.disabled=true;
  next.classList.add("hidden");
  advanceQuestion();
}
function sharedWordBank(stage){
  const proper=new Set(['I','Emma','Ken','John','Jane','Hawaii','English']);
  const words=new Map();
  for(const q of stage.questions)for(const en of [q.en,...(q.variants||[]),...(q.acceptedAnswers||[])]){
    for(const word of tokenize(en)){
      const key=canonical([word]);
      if(!words.has(key))words.set(key,proper.has(word)||/^(Mr|Mrs|Ms|Miss|Dr|Prof)\./.test(word)?word:word.toLowerCase());
    }
  }
  return [...words.values()].sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'})).map((text,id)=>({id,text}));
}
function loadQuestion(){
  const item=currentItem(),q=item.q;
  locked=false;
  const next=document.getElementById("nextBtn");
  if(next){next.classList.add("hidden");next.disabled=false;}
  document.getElementById("word").textContent=currentStage.number+". "+currentStage.word;
  document.getElementById("grammarSaveControls").classList.toggle("hidden",!isSectionMode());
  document.getElementById("progress").textContent=isSectionMode()?((initialRound?"続き · ":"再挑戦 · ")+(qIndex+1)+" / "+currentQueue.length+"（完了 "+grammarSolved.size+" / "+currentStage.questions.length+"）"):(initialRound?(qIndex+1)+" / "+currentQueue.length:"RETRY "+retryRound+" · "+(qIndex+1)+" / "+currentQueue.length);
  document.getElementById("japanese").textContent=q.ja+(q.notes?.length?"（指定："+q.notes.join("、")+"）":"");
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  selected=[];
  pieces=currentMode==="basic-grammar"?sharedWordBank(currentStage):shuffle(tokenize(playableSentence(q)).map((text,id)=>({id,text})));
  document.querySelector(".hint").textContent=currentMode==="basic-grammar"?"この単元の単語を自由に選んで英文を作ろう。同じ単語は何度でも使えます。答えの単語を押すと取り消せます。":"下の単語をクリックして、正しい英文を作ろう。";
  setControls(false);
  renderTokens();
}
function renderTokens(){
  const bank=document.getElementById("bank"), ans=document.getElementById("answer");
  bank.innerHTML=""; ans.innerHTML="";
  pieces.filter(p=>currentMode==="basic-grammar"||!selected.includes(p.id)).forEach(p=>bank.appendChild(tokenButton(p,false)));
  selected.forEach((id,index)=>{const p=pieces.find(p=>p.id===id);if(p)ans.appendChild(tokenButton(p,true,index));});
}
function tokenButton(p,inAnswer,index){
  const b=document.createElement("button");b.className="token";b.textContent=p.text;b.disabled=locked;
  b.onclick=()=>{
    if(locked)return;
    if(inAnswer){if(currentMode==="basic-grammar")selected.splice(index,1);else selected=selected.filter(x=>x!==p.id);}
    else selected.push(p.id);
    document.getElementById("feedback").textContent="";
    renderTokens();
  }; return b;
}
function resetQuestion(){if(locked)return;selected=[];renderTokens();document.getElementById("feedback").textContent="";}
function answerMatches(q,user){return [q.en,...(q.acceptedAnswers||[])].some(en=>canonical(user)===canonical(tokenize(en)));}
function canonical(tokens){return tokens.map(normalizeToken).join(" ").replace(/[’]/g,"'").toLowerCase();}

function celebrateCorrect(grand=false){
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  const layer=document.createElement('div');layer.className='celebration-layer'+(grand?' grand':'');layer.setAttribute('aria-hidden','true');
  const colors=['#f0b83f','#2e9b79','#e56d73','#668de5','#9a6bd1','#f08b4b','#ffd86a'];
  const count=grand?42:24;
  const duration=grand?'2.8s':'1.9s';
  for(const side of ['left','right']){
    for(let i=0;i<count;i++){
      const piece=document.createElement('i');piece.className=`confetti-piece ${side}`;
      const outward=side==='left'?1:-1;
      const x=outward*(50+Math.random()*(grand?330:240)), y=-(110+Math.random()*(grand?440:320));
      piece.style.setProperty('--dx',`${x}px`);piece.style.setProperty('--dy',`${y}px`);piece.style.setProperty('--rot',`${(Math.random()*1100-550)}deg`);piece.style.setProperty('--c',colors[i%colors.length]);piece.style.setProperty('--dur',duration);piece.style.animationDelay=`${Math.random()*(grand?180:120)}ms`;
      piece.style.width=`${6+Math.random()*5}px`;piece.style.height=`${10+Math.random()*8}px`;
      layer.append(piece);
    }
    if(grand){
      for(let i=0;i<9;i++){
        const spark=document.createElement('b');spark.className=`celebration-spark ${side}`;spark.textContent=i%2?'✦':'★';
        const outward=side==='left'?1:-1;
        spark.style.setProperty('--dx',`${outward*(80+Math.random()*300)}px`);spark.style.setProperty('--dy',`${-(180+Math.random()*380)}px`);spark.style.setProperty('--rot',`${Math.random()*360-180}deg`);spark.style.setProperty('--dur','2.8s');spark.style.animationDelay=`${Math.random()*220}ms`;
        layer.append(spark);
      }
    }
  }
  document.body.append(layer);setTimeout(()=>layer.remove(),grand?3300:2300);
}

let titleOwner=null;
function titleBasicEvent(payload){const uid=window.EnglishPlayroomCoins?.getUserId?.()||'';if(titleOwner===null)titleOwner=uid;if(uid&&uid===titleOwner)window.EnglishPlayroomCoins?.recordTitleEvent?.('basic-quest',{...payload,expectedUid:titleOwner});}
function titleQuestion(q,correct){if(currentMode!=="basic")return;titleBasicEvent({kind:'question',itemId:currentStage.number+':'+q.en,correct,first:initialRound});}
function checkAnswer(){
  if(locked)return;
  const item=currentItem(),q=item.q;
  const user=selected.map(id=>pieces.find(p=>p.id===id).text);
  const correct=tokenize(playableSentence(q));
  const fb=document.getElementById("feedback");
  if(currentMode==="basic-grammar"&&!user.length){fb.textContent="単語を選んで英文を作ってください。";fb.className="feedback bad";return;}
  if(currentMode!=="basic-grammar"&&user.length!==correct.length){fb.textContent="まだ使っていない単語があります。";fb.className="feedback bad";return;}
  locked=true;setControls(true);renderTokens();
  if(answerMatches(q,user)){
    titleQuestion(q,true);if(initialRound)initialCorrect++;
    if(isSectionMode())grammarSolved.add(item.index);
    fb.textContent="✓ Correct!";fb.className="feedback good";celebrateCorrect(false);
    const stage=currentStage,queue=currentQueue,index=qIndex;
    setTimeout(()=>{if(currentStage===stage&&currentQueue===queue&&qIndex===index&&!document.getElementById("quizScreen").classList.contains("hidden"))advanceQuestion();},700);
  }else{
    titleQuestion(q,false);retryQueue.push(item);
    fb.textContent="もう一度あとで挑戦しよう。 正解："+q.en;fb.className="feedback bad";
    showNextButton();
  }
}
function giveUp(){
  if(locked)return;
  const item=currentItem(),q=item.q;
  locked=true;setControls(true);retryQueue.push(item);renderTokens();
  const fb=document.getElementById("feedback");
  fb.textContent="正解："+q.en+"　あとでもう一度挑戦しよう。";fb.className="feedback bad";
  showNextButton();
}
function advanceQuestion(){
  if(qIndex<currentQueue.length-1){qIndex++;loadQuestion();return;}
  if(retryQueue.length){
    currentQueue=retryQueue;retryQueue=[];qIndex=0;initialRound=false;retryRound++;loadQuestion();return;
  }
  finishStage();
}
function finishStage(){
  const grammarMode=isSectionMode();
  const finishedNumber=currentStage.number, finishedWord=currentStage.word;
  const total=currentStage.questions.length;
  const doneSet=currentCompleted();
  const newlyCompleted=!doneSet.has(finishedNumber);
  doneSet.add(finishedNumber);
  if(grammarMode){
    if(currentMode==="grammar")localStorage.setItem("english_grammar_completed",JSON.stringify([...grammarCompleted]));
    sectionProgress()[finishedNumber]={solved:currentStage.questions.map((_,i)=>i),completed:true,updatedAt:Date.now()};storeSectionProgress();
    window.basicQuestCloud?.saveGrammarProgress?.()?.catch(e=>console.error("文法進捗の保存に失敗しました",e));
  }else{
    titleBasicEvent({kind:'run',itemId:String(finishedNumber),score:initialCorrect});
    localStorage.setItem("english60_completed",JSON.stringify([...completed]));
    if(newlyCompleted)window.basicQuestCloud?.recordStage?.(finishedNumber);
    else window.basicQuestCloud?.touch?.();
    window.EnglishPlayroomCoins?.recordLearningActivity?.();
    if(initialCorrect>=3)window.EnglishPlayroomCoins?.awardBasic?.(finishedNumber);
  }
  renderStages();
  document.getElementById("completeText").textContent=(currentMode==="basic-grammar"?"基本文法 ":grammarMode?"文法セクション ":"Stage ")+finishedNumber+"「"+finishedWord+"」をクリア！ 初回 "+initialCorrect+" / "+total+" 問正解。";
  celebrateCorrect(true);
  show("completeScreen");
}
async function saveAndExitGrammar(){
  if(!isSectionMode()||!currentStage)return;
  const button=document.getElementById("saveExitBtn");button.disabled=true;
  if(!(currentMode==="basic-grammar"&&basicGrammarCompleted.has(currentStage.number)))sectionProgress()[currentStage.number]={solved:[...grammarSolved].sort((a,b)=>a-b),completed:false,updatedAt:Date.now()};storeSectionProgress();
  try{
    await window.basicQuestCloud?.saveGrammarProgress?.();
    currentStage=null;renderStages();show("selectScreen");
  }catch(e){
    console.error(e);alert("端末には保存しましたが、クラウド保存に失敗しました。通信を確認して、もう一度保存してください。");
  }finally{button.disabled=false;}
}
function goHome(){
  if(currentStage&&isSectionMode()&&!document.getElementById("quizScreen").classList.contains("hidden")){
    const ok=window.confirm("途中で終了して保存を押すと、次回は続きから再開できます。今一覧へ戻ると、前回保存した時点からやり直しになります。戻りますか？");
    if(!ok)return;
  }
  currentStage=null;renderStages();show("selectScreen");
}
window.basicQuestBridge={
  refreshProgressNote:refreshBasicGrammarNote,
  getCompleted:()=>[...completed].sort((a,b)=>a-b),
  mergeCompleted:(arr)=>{
    (Array.isArray(arr)?arr:[]).forEach(n=>{n=Number(n);if(n>=1&&n<=60)completed.add(n);});
    localStorage.setItem("english60_completed",JSON.stringify([...completed]));
    renderStages();
    return [...completed].sort((a,b)=>a-b);
  },
  getBasicGrammarProgress:()=>cleanGrammarProgress(basicGrammarProgress,basicGrammarStages),
  normalizeBasicGrammarProgress:value=>cleanGrammarProgress(value,basicGrammarStages),
  mergeBasicGrammarProgress:value=>{
    const incoming=cleanGrammarProgress(value,basicGrammarStages);
    Object.entries(incoming).forEach(([n,item])=>{if(!basicGrammarProgress[n]||item.updatedAt>=basicGrammarProgress[n].updatedAt)basicGrammarProgress[n]=item;});
    basicGrammarCompleted.clear();Object.entries(basicGrammarProgress).forEach(([n,item])=>{if(item.completed)basicGrammarCompleted.add(Number(n));});
    localStorage.setItem("english_basic_grammar_progress",JSON.stringify(basicGrammarProgress));renderStages();return cleanGrammarProgress(basicGrammarProgress,basicGrammarStages);
  },
  getGrammarProgress:()=>cleanGrammarProgress(grammarProgress),
  normalizeGrammarProgress:(value)=>cleanGrammarProgress(value),
  mergeGrammarProgress:(value)=>{
    const incoming=cleanGrammarProgress(value);
    Object.entries(incoming).forEach(([n,item])=>{
      const existing=grammarProgress[n];
      if(!existing||item.updatedAt>=existing.updatedAt)grammarProgress[n]=item;
      if(item.completed)grammarCompleted.add(Number(n));
    });
    localStorage.setItem("english_grammar_completed",JSON.stringify([...grammarCompleted]));
    storeGrammarProgress();renderStages();return cleanGrammarProgress(grammarProgress);
  }
};
setMode(new URLSearchParams(location.search).get("mode"));
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  onAuthStateChanged, setPersistence, browserLocalPersistence
} from "https://k-oota-pixel.github.io/english-playroom/auth-session.js?v=2.1.2";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ",
  authDomain: "eiken-retry.firebaseapp.com",
  projectId: "eiken-retry",
  storageBucket: "eiken-retry.firebasestorage.app",
  messagingSenderId: "231308672297",
  appId: "1:231308672297:web:5e8b8ede3a0246c2318b38",
  measurementId: "G-8CWR37L5K0"
};

const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const loginBtn=document.getElementById("basicLogin");
const logoutBtn=document.getElementById("basicLogout");
const dot=document.getElementById("basicAuthDot");
const label=document.getElementById("basicAuthLabel");
const note=document.getElementById("basicAuthNote");
const saveNote=document.getElementById("progressSaveNote");
let currentUser=null;
let lastPlayedDate="";

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function refFor(user){return doc(db,"users",user.uid,"apps","basic-quest");}
function shortName(user){
  const n=(user?.displayName||"").trim();
  return n?(n.length>10?n.slice(0,10)+"…":n):"ログイン中";
}
function setUI(mode,text,sub){
  dot.className="authdot"+(mode?` ${mode}`:"");
  label.textContent=text; note.textContent=sub||"";
}
async function saveCloud(){
  if(!currentUser)return;
  const completed=window.basicQuestBridge.getCompleted();
  setUI("busy",shortName(currentUser),"保存中…");
  await setDoc(refFor(currentUser),{
    completedStages:completed,
    grammarProgress:window.basicQuestBridge.getGrammarProgress(),
    basicGrammarProgress:window.basicQuestBridge.getBasicGrammarProgress(),
    completedCount:completed.length,
    lastPlayedDate,
    clientUpdatedAt:Date.now(),
    serverUpdatedAt:serverTimestamp()
  },{merge:true});
  setUI("ok",shortName(currentUser),`☁ ${completed.length} / 60`);
  saveNote.textContent=`✓ ${completed.length} / 60 ステージクリア。Googleアカウントに同期済みです。`;
}
async function syncCloud(user){
  const snap=await getDoc(refFor(user));
  let needsUpload=!snap.exists();
  if(snap.exists()){
    const d=snap.data()||{};
    window.basicQuestBridge.mergeCompleted(d.completedStages||[]);
    const mergedGrammar=window.basicQuestBridge.mergeGrammarProgress(d.grammarProgress||{});
    const mergedBasicGrammar=window.basicQuestBridge.mergeBasicGrammarProgress(d.basicGrammarProgress||{});
    const cloudBasicGrammar=window.basicQuestBridge.normalizeBasicGrammarProgress(d.basicGrammarProgress||{});
    if(typeof d.lastPlayedDate==="string")lastPlayedDate=d.lastPlayedDate;
    const completed=window.basicQuestBridge.getCompleted();
    const cloudCompleted=[...new Set(Array.isArray(d.completedStages)?d.completedStages:[])].sort();
    const cloudGrammar=window.basicQuestBridge.normalizeGrammarProgress(d.grammarProgress||{});
    needsUpload=JSON.stringify(mergedBasicGrammar)!==JSON.stringify(cloudBasicGrammar)||JSON.stringify([...completed].sort())!==JSON.stringify(cloudCompleted)||JSON.stringify(mergedGrammar)!==JSON.stringify(cloudGrammar)||lastPlayedDate!==(typeof d.lastPlayedDate==="string"?d.lastPlayedDate:"");
  }
  const completed=window.basicQuestBridge.getCompleted();
  if(needsUpload&&(completed.length||lastPlayedDate||Object.keys(window.basicQuestBridge.getGrammarProgress()).length||Object.keys(window.basicQuestBridge.getBasicGrammarProgress()).length))await saveCloud();
  else{setUI("ok",shortName(user),`☁ ${completed.length} / 60`);saveNote.textContent=`✓ ${completed.length} / 60 ステージクリア。Googleアカウントに同期済みです。`;}
}
window.basicQuestCloud={
  async saveGrammarProgress(){
    if(!currentUser)return;
    lastPlayedDate=todayKey();
    await saveCloud();
  },
  async recordStage(){
    lastPlayedDate=todayKey();
    try{await saveCloud();}catch(e){console.error(e);setUI("error",currentUser?shortName(currentUser):"Googleログイン","保存エラー");}
  },
  async touch(){
    lastPlayedDate=todayKey();
    try{await saveCloud();}catch(e){console.error(e);}
  }
};

loginBtn.addEventListener("click",async()=>{
  if(currentUser)return;
  loginBtn.disabled=true; setUI("busy","Googleを開いています…","認証中");
  try{await signInWithPopup(auth,provider);}
  catch(e){console.error(e);setUI("error","Googleログイン",e?.code==="auth/popup-blocked"?"ポップアップを許可":"再試行できます");loginBtn.disabled=false;}
});
logoutBtn.addEventListener("click",()=>signOut(auth));

try{await setPersistence(auth,browserLocalPersistence);}catch(e){console.error(e);}

onAuthStateChanged(auth,async user=>{
  currentUser=user||null;
  if(!user){
    logoutBtn.hidden=true;loginBtn.disabled=false;
    const n=window.basicQuestBridge.getCompleted().length;
    setUI("","Googleログイン",n?`端末: ${n} / 60`:"端末保存");
    saveNote.textContent=`✓ ${n} / 60 ステージクリア。この端末に保存中。ログインするとクラウド同期できます。`;
    return;
  }
  logoutBtn.hidden=false;loginBtn.disabled=true;
  setUI("busy",shortName(user),"進捗同期中…");
  try{await syncCloud(user);}
  catch(e){console.error(e);setUI("error",shortName(user),"同期エラー");}
  finally{loginBtn.disabled=false;}
});
</script>
