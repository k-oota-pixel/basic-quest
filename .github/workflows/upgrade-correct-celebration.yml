name: Upgrade correct celebration
on:
  push:
    paths:
      - '.github/workflows/upgrade-correct-celebration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade celebration timing and final burst
        run: |
          python .github/scripts/upgrade-correct-celebration.py
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',t,re.S)
          if not m:
              raise SystemExit('inline script not found')
          Path('/tmp/game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit change and remove one-off files
        run: |
          rm .github/scripts/upgrade-correct-celebration.py .github/workflows/upgrade-correct-celebration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/scripts/upgrade-correct-celebration.py .github/workflows/upgrade-correct-celebration.yml
          git commit -m "Extend celebrations and enhance final clear"
          git push
