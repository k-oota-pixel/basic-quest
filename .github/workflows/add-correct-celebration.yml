name: Add correct celebration
on:
  push:
    paths:
      - '.github/workflows/add-correct-celebration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add correct-answer celebration
        run: python .github/scripts/add-correct-celebration.py
      - name: Commit change and remove one-off files
        run: |
          rm .github/scripts/add-correct-celebration.py .github/workflows/add-correct-celebration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/scripts/add-correct-celebration.py .github/workflows/add-correct-celebration.yml
          git commit -m "Add correct answer celebration"
          git push
