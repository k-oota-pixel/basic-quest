name: Fix Basic Quest tokenization

on:
  push:
    paths:
      - '.github/workflows/coin-reward-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix word-order tokenization and audit all questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_tokenize=r'''function tokenize(sentence){
            return sentence.match(/(?:[A-Za-z]+(?:['’][A-Za-z]+)*|\d+(?:th|st|nd|rd)?|[A-Za-z]+\.|[0-9]+|[^\s]+)/g) || [];
          }'''
          new_tokenize=r'''function tokenize(sentence){
            return sentence.match(/(?:Mr|Mrs|Ms|Miss|Dr|Prof)\.\s+[A-Z][A-Za-z'’-]*|(?:[A-Za-z]\.){2,}|[A-Za-z]+(?:[-'’][A-Za-z]+)*|\d+(?:\.\d+)?(?:th|st|nd|rd)?/g) || [];
          }'''
          if new_tokenize not in s:
              if old_tokenize not in s:
                  raise SystemExit('tokenize target not found')
              s=s.replace(old_tokenize,new_tokenize,1)

          old_sub='WORD ORDER TRAINING · 60 STAGES<br>番号を選んで、4つの英文を完成させよう！'
          new_sub='WORD ORDER TRAINING · 60 STAGES · ver1.6.1<br>番号を選んで、4つの英文を完成させよう！'
          if new_sub not in s:
              if old_sub not in s:
                  raise SystemExit('version subtitle target not found')
              s=s.replace(old_sub,new_sub,1)

          # Audit all 240 questions with the same tokenization rules.
          match=re.search(r'const stages = (\[.*?\]);\nlet currentStage=',s,re.S)
          if not match:
              raise SystemExit('stage data not found')
          stages=json.loads(match.group(1))
          token_re=re.compile(r"(?:Mr|Mrs|Ms|Miss|Dr|Prof)\.\s+[A-Z][A-Za-z'’-]*|(?:[A-Za-z]\.){2,}|[A-Za-z]+(?:[-'’][A-Za-z]+)*|\d+(?:\.\d+)?(?:th|st|nd|rd)?")
          audited=0
          special=[]
          for stage in stages:
              for qi,q in enumerate(stage['questions'],1):
                  audited+=1
                  tokens=token_re.findall(q['en'])
                  if any(t in {'.',',','?','!'} for t in tokens):
                      raise SystemExit(f"standalone punctuation token remains: stage {stage['number']} q{qi}: {tokens}")
                  if re.search(r'\b(?:Mr|Mrs|Ms|Miss|Dr|Prof)\.\s+[A-Z]',q['en']) or re.search(r'\b(?:[A-Za-z]\.){2,}',q['en']):
                      special.append((stage['number'],qi,q['en'],tokens))

          stage33=next(st for st in stages if st['number']==33)
          mr_tokens=token_re.findall(stage33['questions'][1]['en'])
          if 'Mr. Brown' not in mr_tokens or 'Mr' in mr_tokens or '.' in mr_tokens:
              raise SystemExit(f'Mr. Brown was not kept together: {mr_tokens}')

          # Known dotted abbreviations in the current question set must also stay intact.
          for expected in ('p.m.','a.m.'):
              examples=[tokens for _,_,_,tokens in special if expected in tokens]
              if not examples:
                  raise SystemExit(f'{expected} audit failed')

          print(f'Audited {audited} questions. Special expressions:')
          for row in special:
              print(row)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit tokenization fix
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep Basic Quest special expressions together"
          git push
