name: Validate BasicQuest retry flow

on:
  push:
    paths:
      - '.github/workflows/inspect-basicquest.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate quiz script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('main script not found')
          Path('/tmp/basic.js').write_text(m.group(1),encoding='utf-8')
          required=['function giveUp()','function advanceQuestion()','initialCorrect>=3','playableSentence(q)','RETRY ']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          print('Required BasicQuest retry features found')
          PY
          node --check /tmp/basic.js
